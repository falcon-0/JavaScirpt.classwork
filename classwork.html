<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 850px;
        margin: 0 auto;
        padding: 48px 24px;
        background: #f3f6fb;
        color: #1f2937;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
    <h1>JavaScript ClassWork</h1>
    <hr />
    <h2>My name is: <span id="name"></span></h2>
    <h2>Final Object: <span id="final"></span></h2>
    <h2>Car: <span id="car"></span></h2>
    <h2>My Laptop: <span id="laptop"></span></h2>
    <h2>Object Comparison: <span id="Object"></span></h2>
    <h2>Resturant Menu Items: <span id="menu"></span></h2>
    <hr />
    <h2>Balance Display:<span id="balance"></span></h2>
    <h2>Withdrawal Balance: <span id="withdrawalBalance"></span></h2>
    <h2>Final Balance: <span id="finalBalance"></span></h2>
    <h2>Order Summary: <span id="summary"></span></h2>

    <h2>Total Price :<span id="Price"></span></h2>
    <script>
      //   <!-- Student Profile card -->
      const student = {
        name: "Ade",
        age: "34",
        school: "OIC HUB",
        bestsubject: "JavaScript",
        isGraduated: true,
        city: "Osun",
      };
      student.isGraduated = "";
      document.getElementById("name").innerHTML = student.name;
      document.getElementById("final").innerHTML =
        student.name + " " + student.age;

      //   Car Object With Method

      const car = {
        brand: "Toyota",
        model: "Asper",
        color: "Red",
        year: 2008,
        engineON: false,
        start: function () {
          this.engineON = true;
          return "Engine Started";
        },
      };

      const getInfo = function () {
        return "This car is a " + car.year + " " + car.brand + " " + car.model;
      };

      document.getElementById("car").innerHTML = getInfo();

      //   Nested Object - My Laptop

      const laptop = {
        brand: "Dell",
        model: "Precision 5550",
        year: 2020,
        specs: {
          ram: "8GB",
          storage: "512GB SSD",
          processor: "Intel Core i7",
        },
      };

      // Change the ram value and also add color into the specs method
      laptop.specs.ram = "16GB";
      const addColor = (laptop.specs.color = "Silver");

      // LOGS OUT THE NESTED ACCESS FOR THE PROCESSOR VALUE

      document.getElementById("laptop").innerHTML = laptop.specs.processor;

      //   Object Comparison/Update

      const user1 = {
        username: "Tunde",
        password: "1234",
      };
      //   checks if the key username exists in the object and updates the password value to 123
      const userName_Checker = user1.username;
      const password_updater = (user1.password = "123");

      // prints out the keys and values of the object user1
      const keys = Object.keys(user1);
      const values = Object.values(user1);
      document.getElementById("Object").innerHTML =
        "Keys: " + keys + "<br>Values: " + values;

      // Mini Project - Resturrant Menu Items
      const menuItems = {
        name: 10,
        price: "$300",
        isAvaliable: true,
        order: function () {
          if (this.isAvaliable == true) {
            return "Ordered Successfully for $300";
          } else if (this.isAvaliable == false) {
            return "Order not available";
          }
        },
      };
      //  prints the isavalible bassed on the current boolean value of the isAvaliable key in the menuItems object
      document.getElementById("menu").innerHTML = menuItems.order();

      // LATEST CLASS WORK

      // 6th Question Bank Account simulator
      const bankaccount = {
        owner: "FALCON",
        balance: 758,
        pin: "123",
      };

      // adds 100 to bankaccount.balance
      moneydeposit = 100;
      const deposit = function () {
        bankaccount.balance += moneydeposit;
        return "New balance is $" + bankaccount.balance;
      };
      // prints out the new balance  afte adding moneydeposit to the bankaccount.balance
      document.getElementById("balance").innerHTML = deposit();

      //  if the withdraw is more than the availble balance it prints insufficient
      moneywithdraw = 546;
      const withdraw = function () {
        if (moneywithdraw > bankaccount.balance) return "Insufficient funds";
        else {
          bankaccount.balance -= moneywithdraw;
          return "New balance is $" + bankaccount.balance;
        }
      };
      //  prints out the new balance after the withdraw if it is not more than the available balance
      document.getElementById("withdrawalBalance").innerHTML = withdraw();

      // prints out the current balance after the deposit and withdraw function runs
      const checkBalance = function () {
        return "Current balance is $" + bankaccount.balance;
      };

      // this prints out the current balance after the deposit and withdraw
      document.getElementById("finalBalance").innerHTML = checkBalance();

      // object inside Object
      //  E - commerce Order

      const order = {
        orderId: 101,
        customer: {
          name: "Falcon",
          email: "OICB @gmail.com",
          address: {
            street: "123 Main St",
            city: "New York",
            state: "NY",
            zip: "10001",
          },
          products: {
            name: "Laptop",
            price: 1000,
            quantity: 5,
            isDelivered: false,
          },
        },
      };
      // gets the product and multiply it by the quanityt
      const totalprice = function () {
        return order.customer.products.price * order.customer.products.quantity;
      };

      // prints the total price of the product
      document.getElementById("Price").innerHTML = "$ " + totalprice();

      // summary of the order

      const summary = function () {
        return (
          "Order" +
          order.orderId +
          ":" +
          order.customer.name +
          " Ordered " +
          order.customer.products.quantity +
          "X " +
          order.customer.products.name +
          "= $" +
          totalprice()
        );
      };
      // prints the summary of the order
      document.getElementById("summary").innerHTML = summary();

      // Library Book Tracker
      const Book = {
        title: "JS for Beginners",
        author: "John Doe",
        pages: 200,
        isRead: false,
      };
// sets isread back to true
      const readBook = function () {
        Book.isRead = true;
      };
//  adds two new key and property intot the Book function
      const addinfo = ((Book.publsiher = "OIC PUBLISH"), (Book.year = 2026));

      // confirm if the publisher and year was added to the boom function
      console.log(Book.publsiher);
      console.log(Book.year);
    </script>
  </body>
</html>
